# Prometheus + Grafana for Exercise 3.3. The LLM service itself runs on the host:
#   poetry run uvicorn src.app:app --port 8080
# then:  docker compose up -d
#   Prometheus: http://localhost:9090   (Status -> Targets should show llm-service UP)
#   Grafana:    http://localhost:3000   (dashboard "LLM Service")
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the container reach the service on the host

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      # Local lab only: open Grafana without a login
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
